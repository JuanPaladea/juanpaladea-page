<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · Juan Paladea</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --page: rgb(250 250 247);
        --heading: rgb(12 18 24);
        --body: rgb(52 60 70);
        --accent: rgb(15 110 102);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: rgb(10 14 20);
          --heading: rgb(240 244 248);
          --body: rgb(190 199 210);
          --accent: rgb(94 234 212);
        }
      }

      body {
        margin: 0;
        padding: 20vh 20px 40px;
        background: var(--page);
        color: var(--body);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 40rem;
      }

      h1 {
        margin: 0 0 8px;
        color: var(--heading);
        font-size: 2rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Esta página no existe</h1>
      <p><a href="/es">Volver al inicio</a></p>
      <h1 lang="en">This page does not exist</h1>
      <p lang="en"><a href="/">Back to the home page</a></p>
    </main>
  </body>
</html>
