<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />

    <!--
      Apply the saved theme and language before first paint. Without this the
      page would render in the default theme and flash on hydration.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("portfolio-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          root.classList.toggle("dark", theme === "dark");

          var lang = localStorage.getItem("portfolio-lang");
          if (lang !== "en" && lang !== "es") {
            lang = (navigator.language || "en").toLowerCase().indexOf("es") === 0 ? "es" : "en";
          }
          root.lang = lang;
        } catch (e) {
          /* Storage blocked — the app falls back to its defaults. */
        }
      })();
    </script>

    <title>Juan Paladea — Backend Software Developer</title>
