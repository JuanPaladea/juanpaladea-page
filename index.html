<!doctype html>

    <meta charset="UTF-8" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />

    <!--
      Apply the saved theme and language before first paint. Without this the
      page would render in the default theme and flash on hydration.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("portfolio-theme");
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          root.classList.toggle("dark", theme === "dark");

          var lang = localStorage.getItem("portfolio-lang");
          if (lang !== "en" && lang !== "es") {
            // First language in the browser's ordered list that the site ships.
            var tags = navigator.languages || [navigator.language || "en"];
            lang = "en";
            for (var i = 0; i < tags.length; i++) {
              var base = String(tags[i]).toLowerCase().split("-")[0];
              if (base === "es" || base === "en") {
                lang = base;
                break;
              }
            }
          }
          root.lang = lang;
        } catch (e) {
          /* Storage blocked — the app falls back to its defaults. */
        }
      })();
    </script>
